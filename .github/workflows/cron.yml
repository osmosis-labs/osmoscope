name: Cron

# The data crons (UTC), run here rather than on the web host. Scheduled runs
# only happen when the repository variable CRON_RUNNER is "github"; unset it
# to pause them, and never run another host's crons alongside, or every job
# would run twice and double its database writes.
# Manual runs (Actions tab -> Cron -> Run workflow) work either way.
#
# GitHub may start a scheduled run late, or drop it, under load, which is
# heaviest on the hour and quarter hour. The schedules sit off those minutes
# for that reason. The snapshot also tolerates delay: it is epoch-gated (the
# epoch starts around 17:16) and the 17:47 run is its backstop.
on:
  schedule:
    - cron: "16 17 * * *" # snapshot
    - cron: "47 17 * * *" # snapshot (backstop)
    - cron: "4 * * * *" # treasury
    - cron: "34 * * * *" # revenue
    - cron: "7,22,37,52 * * * *" # rate-limits
  workflow_dispatch:
    inputs:
      job:
        description: Cron to run
        required: true
        type: choice
        options: [snapshot, treasury, revenue, rate-limits]

permissions:
  contents: read

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.CRON_RUNNER == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run per cron at a time, whichever trigger started it: a late run
    # waits rather than overlapping (overlapping rate-limit runs would read
    # the same alert state and notify twice). The job name expression is
    # repeated in env below, since concurrency cannot read env.
    concurrency:
      group: cron-${{ github.event.inputs.job || ((github.event.schedule == '16 17 * * *' || github.event.schedule == '47 17 * * *') && 'snapshot') || (github.event.schedule == '4 * * * *' && 'treasury') || (github.event.schedule == '34 * * * *' && 'revenue') || (github.event.schedule == '7,22,37,52 * * * *' && 'rate-limits') || 'unknown' }}
      cancel-in-progress: false
    env:
      JOB: ${{ github.event.inputs.job || ((github.event.schedule == '16 17 * * *' || github.event.schedule == '47 17 * * *') && 'snapshot') || (github.event.schedule == '4 * * * *' && 'treasury') || (github.event.schedule == '34 * * * *' && 'revenue') || (github.event.schedule == '7,22,37,52 * * * *' && 'rate-limits') || 'unknown' }}
      # Values a cron keeps between runs (lib/cron-state.ts), carried in the
      # actions cache below.
      CRON_STATE_FILE: .cron-state/state.json
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NUMIA_API_KEY: ${{ secrets.NUMIA_API_KEY }}
      NUMIA_API_URL: ${{ secrets.NUMIA_API_URL }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      SQS_API_URL: ${{ secrets.SQS_API_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Yarn 4 comes from the packageManager field via Corepack.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable
      - run: yarn db:generate

      # The newest state this cron saved. Cache keys are immutable, so each
      # run attempt saves under its own key (run_id stays the same on a
      # re-run, run_attempt does not) and restores the newest by prefix.
      - uses: actions/cache/restore@v4
        with:
          path: .cron-state
          key: cron-state-${{ env.JOB }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cron-state-${{ env.JOB }}-

      # An unknown JOB fails here with the runner's usage message. The state
      # directory always exists, so the save below has something to store.
      - run: mkdir -p .cron-state && yarn cron "$JOB"

      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .cron-state
          key: cron-state-${{ env.JOB }}-${{ github.run_id }}-${{ github.run_attempt }}
