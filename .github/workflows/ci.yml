name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the job only checks the code (the repository default is
# write, which pushes to main would otherwise get).
permissions:
  contents: read

jobs:
  checks:
    name: type-check, lint, format, test
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts refuses to load without DATABASE_URL. Nothing in this
      # job connects to a database (prisma generate only emits the client), so
      # a placeholder is enough.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Yarn 4 comes from the packageManager field via Corepack; enable it
      # before setup-node so the yarn cache resolves against the right binary.
      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable
      - run: yarn db:generate
      - run: yarn type-check
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
