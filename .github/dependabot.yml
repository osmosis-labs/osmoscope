# Update PRs for the SHA-pinned workflow actions and the npm dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all actions: cache/restore and cache/save must move together,
    # and the workflows are easier to check as one change.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR a week for minor and patch bumps; majors still get a PR each,
    # since they usually need code changes and their own testing.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the Node runtime (.nvmrc); its major moves with a
      # Node upgrade, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
